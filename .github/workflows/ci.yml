name: Guteneo checks
on:
  # Every PR runs full; main qualifies identical-source proof or runs full again.
  # Keep this workflow unfiltered: API/mobile contracts, shared npm dependencies
  # and scanner changes must retain every required backend/browser check.
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # A PR always executes the complete suite. Only an identical, freshly tested
  # ordinary main merge may reuse its complete proof; unknown evidence runs full.
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      reused: ${{ steps.qualify.outputs.reused }}
      proof_b64: ${{ steps.qualify.outputs.proof_b64 }}
      run_id: ${{ steps.select.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts/ci
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Select an eligible complete PR proof without executing its contents
        id: select
        run: node scripts/ci/validation-proof.mjs select
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_FORCE_FULL: ${{ vars.CI_FORCE_FULL || 'false' }}
      - name: Read only the selected immutable proof artifact
        if: steps.select.outputs.candidate == 'true'
        id: download
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.select.outputs.run_id }}
          artifact-ids: ${{ steps.select.outputs.artifact_id }}
          path: test-results/ci/pr-validation-proof
      - name: Qualify exact source, policy, environment and complete test evidence
        if: always()
        id: qualify
        run: node scripts/ci/validation-proof.mjs qualify test-results/ci/pr-validation-proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_FORCE_FULL: ${{ vars.CI_FORCE_FULL || 'false' }}

  # Refuse unsupported dependency graphs before starting builds or browser setup.
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
            packages/contracts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Require supported dependency peers, template engine and patched transport
        run: npm run check:dependencies
      - name: Reject known high and critical dependency advisories
        run: npm run audit:dependencies
      - name: Bind the exercised suite to its actual runtime
        if: always()
        run: node scripts/ci/validation-proof.mjs runtime 'dependencies' 'test-results/ci/environments/runtime-dependencies.json'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ci-evidence-runtime-dependencies
          path: test-results/ci/environments/runtime-dependencies.json
          if-no-files-found: error
          retention-days: 14

  pdf-validator:
    if: needs.qualification.outputs.reused != 'true'
    needs: qualification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            scripts/ci
            apps/pdf-validator
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/pdf-validator/package-lock.json
      - run: npm ci --prefix apps/pdf-validator
      - run: npm --prefix apps/pdf-validator run typecheck
      - run: npm --prefix apps/pdf-validator test
      - name: Bind the exercised suite to its actual runtime
        if: always()
        run: node scripts/ci/validation-proof.mjs runtime 'pdf-validator' 'test-results/ci/environments/runtime-pdf-validator.json'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ci-evidence-runtime-pdf-validator
          path: test-results/ci/environments/runtime-pdf-validator.json
          if-no-files-found: error
          retention-days: 14

  scanner:
    needs: qualification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reuse the scanner suite from the qualified complete PR run
        if: needs.qualification.outputs.reused == 'true'
        run: printf 'Scanner proof retained from complete PR validation run %s; verify checks its provenance again.\n' "$VALIDATION_RUN_ID"
        env:
          VALIDATION_RUN_ID: ${{ needs.qualification.outputs.run_id }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.qualification.outputs.reused != 'true'
        with:
          sparse-checkout: |
            scripts/ci
            apps/scanner
            packages/observability
            .github/workflows
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: needs.qualification.outputs.reused != 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/scanner/package-lock.json
      - run: npm ci --prefix apps/scanner
        if: needs.qualification.outputs.reused != 'true'
      - run: npm --prefix apps/scanner run typecheck
        if: needs.qualification.outputs.reused != 'true'
      - run: npm --prefix apps/scanner test
        if: needs.qualification.outputs.reused != 'true'
      - name: Bind the exercised suite to its actual runtime
        if: always() && needs.qualification.outputs.reused != 'true'
        run: node scripts/ci/validation-proof.mjs runtime 'scanner' 'test-results/ci/environments/runtime-scanner.json'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && needs.qualification.outputs.reused != 'true'
        with:
          name: ci-evidence-runtime-scanner
          path: test-results/ci/environments/runtime-scanner.json
          if-no-files-found: error
          retention-days: 14

  checks:
    if: needs.qualification.outputs.reused != 'true'
    needs: [dependencies, qualification]
    runs-on: ubuntu-latest
    # Include fresh FFmpeg package installation and every narration assertion.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Keep application assets, narration sources and every test. Omit only
          # immutable film archives and historical screenshots, not fresh proof.
          # checkout uses blob:none for sparse trees, so these bytes are not fetched.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/videos/guteneo-gutenberg/archive/
            !/videos/guteneo-gutenberg/media-parts/
            !/reports/screenshots/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check:integrations
      - run: npm run typecheck
      - run: npm run lint
      - name: Require synchronized documentation, English sources and canonical links
        run: npm run docs:check
      - name: Require feature and developer documentation in the same change
        if: github.event_name == 'pull_request'
        env:
          DOCS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$DOCS_BASE_SHA"
          node scripts/repository-standards.mjs --base "$DOCS_BASE_SHA"
      - name: Audit every advertised MCP tool annotation and justification
        run: npm run audit:mcp
      - run: node scripts/migrate-remote.mjs --verify
      - run: npm run costs
      - name: Prefer official Ubuntu archives over the slow Azure mirror
        run: node scripts/ci/ubuntu-mirrors.mjs
      - name: Run every offline narration test
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          mkdir -p test-results/ci
          set -o pipefail
          npm run test:videos:narration | tee test-results/ci/narration.log
      - name: Bind the exercised suite to its actual runtime
        if: always()
        run: node scripts/ci/validation-proof.mjs runtime 'checks' 'test-results/ci/environments/runtime-checks.json'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ci-evidence-checks
          path: |
            test-results/ci/environments/runtime-checks.json
            reports/cost-model.json
            test-results/ci/narration.log
          if-no-files-found: error
          retention-days: 14

  vitest:
    if: needs.qualification.outputs.reused != 'true'
    needs: [dependencies, qualification]
    runs-on: ubuntu-latest
    # Shards stay sequential; allow setup time without cutting test coverage.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Keep application assets, narration sources and every test. Omit only
          # immutable film archives and historical screenshots, not fresh proof.
          # checkout uses blob:none for sparse trees, so these bytes are not fetched.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/videos/guteneo-gutenberg/archive/
            !/videos/guteneo-gutenberg/media-parts/
            !/reports/screenshots/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Every shard retains sequential files and isolated Miniflare databases.
      # Only the actual Chromium integration is handled by the security job.
      - run: >-
          npx vitest run --shard=${{ matrix.shard }}/4
          --exclude=tests/integration/document-postal-preflight.test.ts
          --exclude=tests/integration/expert-review-renderer.test.ts
          --exclude=tests/integration/postal-address-page-renderer.test.ts
          --exclude=tests/integration/secure-resend-journey.test.ts
          --exclude=tests/integration/templates-renderer.test.ts
          --reporter=default --reporter=json --reporter=blob
          --outputFile.json=test-results/ci/vitest-${{ matrix.shard }}.json
          --outputFile.blob=test-results/ci/blobs/${{ matrix.shard }}.json
      - name: Preserve the newly exercised restore proof
        if: always()
        run: node scripts/ci/collect-restore-proof.mjs test-results/ci/vitest-${{ matrix.shard }}.json
      - name: Bind the exercised suite to its actual runtime
        if: always()
        run: node scripts/ci/validation-proof.mjs runtime 'vitest-${{ matrix.shard }}' 'test-results/ci/environments/runtime-vitest-${{ matrix.shard }}.json'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ci-vitest-${{ matrix.shard }}
          path: test-results/ci/blobs/${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ci-evidence-vitest-${{ matrix.shard }}
          path: |
            test-results/ci/environments/runtime-vitest-${{ matrix.shard }}.json
            test-results/ci/vitest-${{ matrix.shard }}.json
            test-results/ci/restore-proof.json
          if-no-files-found: error
          retention-days: 14

  security:
    if: needs.qualification.outputs.reused != 'true'
    needs: [dependencies, qualification]
    runs-on: ubuntu-latest
    # The same WebKit dependency mirrors precede the renderer/security tests.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Keep application assets, narration sources and every test. Omit only
          # immutable film archives and historical screenshots, not fresh proof.
          # checkout uses blob:none for sparse trees, so these bytes are not fetched.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/videos/guteneo-gutenberg/archive/
            !/videos/guteneo-gutenberg/media-parts/
            !/reports/screenshots/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Security setup forms exercise both engines, not just Chromium.
      - name: Prefer official Ubuntu archives over the slow Azure mirror
        run: node scripts/ci/ubuntu-mirrors.mjs
      - run: npx playwright install --with-deps chromium webkit
      - name: Preserve the Chromium sandbox
        run: node scripts/ci/chromium-sandbox.mjs
      - run: >-
          npx vitest run tests/integration/document-postal-preflight.test.ts tests/integration/expert-review-renderer.test.ts tests/integration/postal-address-page-renderer.test.ts tests/integration/secure-resend-journey.test.ts tests/integration/templates-renderer.test.ts
          --reporter=default --reporter=json --reporter=blob
          --outputFile.json=test-results/ci/vitest-renderer.json
          --outputFile.blob=test-results/ci/blobs/renderer.json
      - name: Run every Node security test
        run: |
          set -o pipefail
          node --test tests/security/*.test.mjs | tee test-results/ci/security.log
      - name: Bind the exercised suite to its actual runtime
        if: always()
        run: node scripts/ci/validation-proof.mjs runtime 'security' 'test-results/ci/environments/runtime-security.json'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ci-vitest-renderer
          path: test-results/ci/blobs/renderer.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ci-evidence-security
          path: |
            test-results/ci/environments/runtime-security.json
            test-results/ci/vitest-renderer.json
            test-results/ci/security.log
          if-no-files-found: error
          retention-days: 14

  build:
    if: needs.qualification.outputs.reused != 'true'
    needs: [dependencies, qualification]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      browser-matrix: ${{ steps.browser-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Keep application assets, narration sources and every test. Omit only
          # immutable film archives and historical screenshots, not fresh proof.
          # checkout uses blob:none for sparse trees, so these bytes are not fetched.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/videos/guteneo-gutenberg/archive/
            !/videos/guteneo-gutenberg/media-parts/
            !/reports/screenshots/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Define every isolated browser project and shard
        id: browser-matrix
        run: node scripts/ci/browser-results.mjs matrix >> "$GITHUB_OUTPUT"
      # Build the final non-preview frontend once; every Worker dry run remains.
      - run: npm run build:live
      - run: npx wrangler deploy --dry-run --outdir dist/worker
      - run: npx wrangler deploy --config apps/documents/wrangler.jsonc --dry-run --outdir ../../dist/documents-worker
      - run: npx wrangler deploy --config wrangler.live.jsonc --dry-run --outdir dist/live-worker
      - run: npm run build:preview
      - run: npm run build:status
      - run: npx wrangler deploy --config wrangler.status.jsonc --dry-run --outdir dist/status-worker
      - name: Bind the exercised suite to its actual runtime
        if: always()
        run: node scripts/ci/validation-proof.mjs runtime 'build' 'test-results/ci/environments/runtime-build.json'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ci-evidence-runtime-build
          path: test-results/ci/environments/runtime-build.json
          if-no-files-found: error
          retention-days: 14
      - name: Deduplicate exact application and preview output bytes
        run: node scripts/ci/build-artifact.mjs pack test-results/ci/build-artifact
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: guteneo-browser-builds-${{ github.sha }}
          # Already-compressed media stays uncompressed; identical output bytes
          # share one verified object, then reconstruct both ordinary products.
          compression-level: 0
          path: test-results/ci/build-artifact/
          if-no-files-found: error
          retention-days: 1

  browser:
    if: needs.qualification.outputs.reused != 'true'
    needs: [build, qualification]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    # Each project is split across isolated runners, never concurrent local DBs.
    # Keep setup budgets and every browser/media assertion unchanged.
    timeout-minutes: 30
    env:
      # WebKit's legacy Linux playbin stalls on valid H.264/AAC media in its
      # download buffer. Use its supported playbin3 pipeline; native Safari is
      # unaffected, and the real decode/progression/seek assertions stay intact.
      WEBKIT_GST_USE_PLAYBIN3: "1"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.browser-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Keep application assets, narration sources and every test. Omit only
          # immutable film archives and historical screenshots, not fresh proof.
          # checkout uses blob:none for sparse trees, so these bytes are not fetched.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/videos/guteneo-gutenberg/archive/
            !/videos/guteneo-gutenberg/media-parts/
            !/reports/screenshots/
            !/videos/*
            /videos/guteneo-film/
            !/videos/guteneo-film/*
            /videos/guteneo-film/narration/
            !/videos/guteneo-film/narration/*
            /videos/guteneo-film/narration/releases/
            !/videos/guteneo-film/narration/releases/*/*
            /videos/guteneo-film/narration/releases/*/scripts.json
            !/assets/
            !/apps/web/public/videos/
            !/ios/
            !/apps/engineering/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Prefer official Ubuntu archives over the slow Azure mirror
        run: node scripts/ci/ubuntu-mirrors.mjs
      - run: npx playwright install --with-deps ${{ matrix.browsers }}
      - name: Preserve the Chromium sandbox
        run: node scripts/ci/chromium-sandbox.mjs
      - name: Select the current run's latest immutable build artifact
        id: artifacts
        run: node scripts/ci/select-artifacts.mjs build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ steps.artifacts.outputs.buildArtifactIds }}
          path: test-results/ci/build-artifact
          merge-multiple: true
      - name: Restore and verify every selected static-product byte
        run: node scripts/ci/build-artifact.mjs restore test-results/ci/build-artifact web ${{ matrix.preview != '' && 'preview' || '' }}
      - name: Remove historical screenshot evidence from this fresh runner
        run: rm -rf reports/screenshots
      - name: Verify the four-language MCP Apps SDK fixtures
        if: ${{ matrix.project == 'chromium' && matrix.shardIndex == 3 }}
        run: node --test tests/browser/mcp-ui-probe.test.mjs tests/browser/mcp-document-upload.test.mjs
      # Each shard has its own runner, D1/R2 state and fixed local server ports.
      - run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          GUTENEO_E2E_PREBUILT: "true"
          PLAYWRIGHT_HTML_OUTPUT_DIR: test-results/ci/browser/${{ matrix.project }}/shard-${{ matrix.shardIndex }}/html
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/ci/browser/${{ matrix.project }}/shard-${{ matrix.shardIndex }}/application.json
      - if: ${{ matrix.preview != '' }}
        run: npx playwright test --config playwright.preview.config.ts --project=${{ matrix.preview }} --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/ci/browser/${{ matrix.project }}/shard-${{ matrix.shardIndex }}/preview.json
      - name: Verify the private control tower with fictional local data
        if: ${{ matrix.preview != '' && matrix.shardIndex == 1 }}
        run: npx playwright test --config playwright.belvedere.config.ts --project=${{ matrix.preview }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/ci/browser/${{ matrix.project }}/shard-${{ matrix.shardIndex }}/belvedere.json
      - name: Verify status history, stale evidence and seasonal controls
        if: ${{ matrix.project == 'chromium' && matrix.shardIndex == 1 }}
        run: npx playwright test --config playwright.status.config.ts
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/ci/browser/${{ matrix.project }}/shard-${{ matrix.shardIndex }}/status.json
      - name: Bind every suite report to this exact project, shard and run
        if: always()
        run: node scripts/ci/browser-results.mjs record '${{ matrix.project }}' '${{ matrix.shardIndex }}'
      - name: Bind the exercised suite to its actual runtime
        if: always()
        run: node scripts/ci/validation-proof.mjs runtime 'browser-${{ matrix.project }}-${{ matrix.shardIndex }}' 'test-results/ci/environments/runtime-browser-${{ matrix.project }}-${{ matrix.shardIndex }}.json'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ci-evidence-browser-${{ matrix.project }}-${{ matrix.shardIndex }}
          path: |
            test-results/ci/environments/runtime-browser-${{ matrix.project }}-${{ matrix.shardIndex }}.json
            test-results/ci/browser/${{ matrix.project }}/shard-${{ matrix.shardIndex }}/
            test-results/ci/artifact-selection-build.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ci-debug-browser-${{ matrix.project }}-${{ matrix.shardIndex }}
          path: |
            test-results/application/
            test-results/preview/
            test-results/belvedere/
            test-results/status/
            reports/screenshots/
            reports/mcp-ui-probe/
            reports/mcp-document-upload/
          if-no-files-found: ignore
          retention-days: 14

  engineering:
    if: needs.qualification.outputs.reused != 'true'
    needs: [dependencies, qualification]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/videos/guteneo-gutenberg/archive/
            !/videos/guteneo-gutenberg/media-parts/
            !/reports/screenshots/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/engineering/package-lock.json
      - run: npm ci
      - run: PUPPETEER_SKIP_DOWNLOAD=true npm ci --prefix apps/engineering
      - run: npm audit --prefix apps/engineering --audit-level=high
      - run: npm run docs:check
      - run: npm run build:engineering
      - name: Prefer official Ubuntu archives over the slow Azure mirror
        run: node scripts/ci/ubuntu-mirrors.mjs
      - name: Install the documentation browsers
        run: npx playwright install --with-deps chromium webkit
      - run: npm run test:engineering
      - name: Verify asset-only deployment configuration
        working-directory: apps/engineering
        run: npx wrangler deploy --dry-run
      - name: Bind the exercised suite to its actual runtime
        if: always()
        run: node scripts/ci/validation-proof.mjs runtime 'engineering' 'test-results/ci/environments/runtime-engineering.json'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ci-evidence-engineering
          path: |
            test-results/ci/environments/runtime-engineering.json
            test-results/engineering/
            test-results/engineering-report/
            apps/engineering/dist/release.json
          if-no-files-found: error
          retention-days: 14

  distribution-e2e:
    if: needs.qualification.outputs.reused != 'true'
    needs: [build, qualification]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - authentication: strong
            config: e2e.config.ts
            expected: 14
          - authentication: verified_account
            config: e2e.verified-account.config.ts
            expected: 2
    env:
      E2E_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_WRITE_LOGS: "false"
      GUTENEO_E2E_PREBUILT: "true"
      EXPECTED_DISTRIBUTION_RESULTS: ${{ matrix.expected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/videos/guteneo-gutenberg/archive/
            !/videos/guteneo-gutenberg/media-parts/
            !/reports/screenshots/
            !/videos/*
            /videos/guteneo-film/
            !/videos/guteneo-film/*
            /videos/guteneo-film/narration/
            !/videos/guteneo-film/narration/*
            /videos/guteneo-film/narration/releases/
            !/videos/guteneo-film/narration/releases/*/*
            /videos/guteneo-film/narration/releases/*/scripts.json
            !/assets/
            !/apps/web/public/videos/
            !/ios/
            !/apps/engineering/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Prefer official Ubuntu archives over the slow Azure mirror
        run: node scripts/ci/ubuntu-mirrors.mjs
      - name: Install the local PDF renderer browser
        run: npx --no-install playwright install chromium
      - name: Install the independent TesterArmy browser and dependencies
        run: npx --no-install e2e-web install chromium --with-deps
      - name: Preserve the renderer Chromium sandbox
        run: node scripts/ci/chromium-sandbox.mjs
      - name: Select the current run's latest immutable build artifact
        id: artifacts
        run: node scripts/ci/select-artifacts.mjs build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ steps.artifacts.outputs.buildArtifactIds }}
          path: test-results/ci/build-artifact
          merge-multiple: true
      - name: Restore and verify every application byte
        run: node scripts/ci/build-artifact.mjs restore test-results/ci/build-artifact web
      - name: Exercise secure distribution and the unified account with fictional data
        run: |
          mkdir -p test-results/ci
          set -o pipefail
          npm run test:distribution -- --config '${{ matrix.config }}' | tee test-results/ci/distribution.log
      - name: Require complete deterministic coverage on both viewports
        run: |
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          const { run } = JSON.parse(await readFile('test-results/distribution-e2e/report.json', 'utf8'));
          const { summary, usage } = run;
          if (run.status !== 'passed' || run.exitCode !== 0 || run.errors.length !== 0 ||
              summary.discovered !== Number(process.env.EXPECTED_DISTRIBUTION_RESULTS) || summary.selected !== summary.discovered ||
              summary.executed !== summary.discovered || summary.passed !== summary.discovered ||
              summary.failed || summary.skipped || summary.flaky || summary.interrupted ||
              run.results.some(result => result.status !== 'passed') ||
              JSON.stringify(run.targets.map(target => target.id).sort()) !== JSON.stringify(['desktop', 'phone']) ||
              usage.modelTokens !== 0 || usage.maxModelCallsInStep !== 0) {
            throw new Error('Secure distribution requires every deterministic test to pass without skips or model calls.');
          }
          console.log(`${summary.passed} deterministic browser results verified; no model calls.`);
          JS
      - name: Bind the exercised suite to its actual runtime
        if: always()
        run: node scripts/ci/validation-proof.mjs runtime 'distribution-${{ matrix.authentication }}' 'test-results/ci/environments/runtime-distribution-${{ matrix.authentication }}.json'
      - name: Independently clear every upload path for invitation secrets
        if: always()
        id: distribution-privacy
        run: |
          node --input-type=module <<'JS'
          import { readFile, appendFile } from 'node:fs/promises';
          import { assertNoInvitationSecrets } from './scripts/test-distribution-secrets.mjs';
          try {
            const marker = JSON.parse(await readFile('test-results/distribution-e2e-sanitized.json', 'utf8'));
            const { run } = JSON.parse(await readFile('test-results/distribution-e2e/report.json', 'utf8'));
            if (marker.schema !== 1 || marker.runId !== run.id) throw new Error('No current artifact privacy clearance.');
            const { state } = JSON.parse(await readFile('test-results/distribution-e2e-state.json', 'utf8'));
            await assertNoInvitationSecrets(state, ['test-results/ci/environments/runtime-distribution-${{ matrix.authentication }}.json', 'test-results/ci/distribution.log', 'test-results/distribution-e2e-state.json', 'test-results/distribution-e2e-sanitized.json']);
            await appendFile(process.env.GITHUB_OUTPUT, 'verified=true\n');
          } catch {
            console.error('Distribution artifacts are not cleared for upload.');
            process.exitCode = 1;
          }
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && steps.distribution-privacy.outputs.verified == 'true'
        with:
          name: ci-evidence-distribution-${{ matrix.authentication }}
          path: |
            test-results/ci/environments/runtime-distribution-${{ matrix.authentication }}.json
            test-results/distribution-e2e/
            test-results/distribution-e2e-server.log
            test-results/distribution-e2e-state.json
            test-results/distribution-e2e-sanitized.json
            test-results/ci/distribution.log
            test-results/ci/artifact-selection-build.json
          if-no-files-found: error
          retention-days: 14

  # The required gate either accounts for every new test or independently
  # rechecks a sealed identical-source full proof. Missing evidence fails closed.
  # Native XCTest/archive have their own source-filtered workflow, not a web gate.
  verify:
    if: always()
    permissions:
      contents: read
      actions: read
      pull-requests: read
    needs:
      [
        qualification,
        dependencies,
        pdf-validator,
        scanner,
        checks,
        vitest,
        security,
        build,
        browser,
        distribution-e2e,
        engineering,
      ]
    runs-on: ubuntu-latest
    # Checkout and evidence download share this budget with verification.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Report merging loads only the root Vitest config; retain the complete
          # unit/browser inventories and their source imports. The only public
          # asset read during discovery is OpenAPI; do not fetch current films.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /scripts/
            /tests/unit/
            /tests/integration/
            /tests/e2e/
            /tests/preview-e2e/
            /tests/belvedere-e2e/
            /tests/status-e2e/
            /tests/fixtures/
            /tests/public-language.ts
            /apps/web/src/
            /apps/web/public/openapi.json
            /apps/api/src/
            /packages/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
        if: needs.qualification.outputs.reused != 'true'
      - name: Select latest reports per immutable current-run artifact
        if: needs.qualification.outputs.reused != 'true'
        id: artifacts
        run: node scripts/ci/select-artifacts.mjs verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.qualification.outputs.reused != 'true'
        with:
          artifact-ids: ${{ steps.artifacts.outputs.vitestArtifactIds }}
          path: test-results/ci/blobs
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.qualification.outputs.reused != 'true'
        with:
          artifact-ids: ${{ steps.artifacts.outputs.evidenceArtifactIds }}
          path: test-results/ci/evidence
      - name: Merge all Vitest results without rerunning tests
        if: needs.qualification.outputs.reused != 'true'
        run: |
          rm -f reports/vitest.json
          npx vitest run --merge-reports=test-results/ci/blobs \
            --reporter=json --outputFile.json=reports/vitest.json
      - name: Require every job and every discovered test file
        if: always() && needs.qualification.outputs.reused != 'true'
        run: node scripts/ci/verify-results.mjs
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
      - name: Independently recheck the qualified complete PR proof
        if: always() && needs.qualification.outputs.reused == 'true'
        run: node scripts/ci/validation-proof.mjs verify-reused test-results/ci/verified.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REUSE_PROOF_B64: ${{ needs.qualification.outputs.proof_b64 }}
          CI_FORCE_FULL: ${{ vars.CI_FORCE_FULL || 'false' }}
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
      - name: Record a full PR validation only after complete inventory verification
        id: full-proof
        continue-on-error: true
        if: success() && github.event_name == 'pull_request' && needs.qualification.outputs.reused != 'true'
        run: node scripts/ci/validation-proof.mjs record test-results/ci/verified.json test-results/ci/proof.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        continue-on-error: true
        if: success() && steps.full-proof.outcome == 'success' && github.event_name == 'pull_request' && needs.qualification.outputs.reused != 'true'
        with:
          name: ci-validation-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/ci/proof.json
            test-results/ci/verified.json
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: guteneo-verification
          path: |
            reports/vitest.json
            test-results/ci/verified.json
            test-results/ci/browser-verified.json
            test-results/ci/proof.json
            test-results/ci/artifact-selection-verify.json
          if-no-files-found: error
          retention-days: 14
