name: Guteneo checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/scanner/package-lock.json
      - run: npm ci --prefix apps/scanner
      - run: npm --prefix apps/scanner run typecheck
      - run: npm --prefix apps/scanner test
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: node scripts/migrate-remote.mjs --verify
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run build:live
      - run: npx wrangler deploy --config wrangler.live.jsonc --dry-run --outdir dist/live-worker
      - run: npm run build:preview
      - run: npm run test:preview
      - run: npm run costs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: guteneo-verification
          path: |
            reports/
            playwright-report/
            test-results/
          retention-days: 14
