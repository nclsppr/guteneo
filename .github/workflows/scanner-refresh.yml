name: Refresh private scanner signatures

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Never cancel a publication after its image push or Worker deployment began.
concurrency:
  group: guteneo-production-scanner-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require reviewed main and the dedicated scanner credential
        env:
          CLOUDFLARE_SCANNER_API_TOKEN: ${{ secrets.CLOUDFLARE_SCANNER_API_TOKEN }}
          SCANNER_REFRESH_ENABLED: ${{ vars.SCANNER_REFRESH_ENABLED }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo "Scanner refresh requires reviewed main."; exit 1; }
          test -n "$CLOUDFLARE_SCANNER_API_TOKEN" || { echo "Missing CLOUDFLARE_SCANNER_API_TOKEN: scanner refresh is not activated."; exit 1; }
          if test "$GITHUB_EVENT_NAME" = schedule; then
            test "$SCANNER_REFRESH_ENABLED" = true || { echo "SCANNER_REFRESH_ENABLED must be true: scheduled refresh is disabled."; exit 1; }
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/scanner/package-lock.json
      - run: npm ci --prefix apps/scanner
      - name: Require a tracked, unexpired maintenance credential
        run: node apps/scanner/scripts/maintenance-status.mjs --check-settings
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SCANNER_API_TOKEN }}
          SCANNER_REFRESH_ENABLED: ${{ vars.SCANNER_REFRESH_ENABLED }}
          SCANNER_TOKEN_EXPIRES_AT: ${{ vars.SCANNER_TOKEN_EXPIRES_AT }}
      - name: Build, qualify, publish and verify only the private scanner
        run: node apps/scanner/scripts/ci-refresh.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SCANNER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "39ac9fada6cba44d9ecf09d467609e69"
          WRANGLER_SEND_METRICS: "false"
          SCANNER_REFRESH_ENABLED: ${{ vars.SCANNER_REFRESH_ENABLED }}
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scanner-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/scanner/dist/ci-refresh/
          if-no-files-found: warn
          retention-days: 30
      - name: Explain an incomplete scanner refresh
        if: failure()
        run: |
          echo "## Scanner refresh needs attention" >> "$GITHUB_STEP_SUMMARY"
          echo "The scanner has not been newly qualified by this run. Inspect the failed step and retained evidence before retrying a publication or deployment." >> "$GITHUB_STEP_SUMMARY"
          echo "Check SCANNER_REFRESH_ENABLED, CLOUDFLARE_SCANNER_API_TOKEN, SCANNER_TOKEN_EXPIRES_AT and the exact main CI. Never extend the 72-hour signature limit." >> "$GITHUB_STEP_SUMMARY"
