name: Refresh private scanner signatures

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Never cancel a publication after its image push or Worker deployment began.
concurrency:
  group: guteneo-production-scanner-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || vars.SCANNER_REFRESH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require reviewed main and the dedicated scanner credential
        env:
          CLOUDFLARE_SCANNER_API_TOKEN: ${{ secrets.CLOUDFLARE_SCANNER_API_TOKEN }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo "Scanner refresh requires reviewed main."; exit 1; }
          test -n "$CLOUDFLARE_SCANNER_API_TOKEN" || { echo "Missing CLOUDFLARE_SCANNER_API_TOKEN: scanner refresh is not activated."; exit 1; }
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/scanner/package-lock.json
      - run: npm ci --prefix apps/scanner
      - name: Build, qualify, publish and verify only the private scanner
        run: node apps/scanner/scripts/ci-refresh.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SCANNER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "39ac9fada6cba44d9ecf09d467609e69"
          WRANGLER_SEND_METRICS: "false"
          SCANNER_REFRESH_ENABLED: ${{ vars.SCANNER_REFRESH_ENABLED }}
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scanner-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/scanner/dist/ci-refresh/
          if-no-files-found: warn
          retention-days: 30
