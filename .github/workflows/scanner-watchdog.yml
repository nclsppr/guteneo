name: Check private scanner maintenance

on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Serialize with refresh so live identity checks cannot observe its rollout halfway.
concurrency:
  group: guteneo-production-scanner-refresh
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            apps/scanner
            packages/observability
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/scanner/package-lock.json
      - run: npm ci --prefix apps/scanner
      - name: Check activation, latest qualification and actual signature freshness
        run: node apps/scanner/scripts/maintenance-status.mjs --watchdog
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SCANNER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "39ac9fada6cba44d9ecf09d467609e69"
          SCANNER_REFRESH_ENABLED: ${{ vars.SCANNER_REFRESH_ENABLED }}
          SCANNER_TOKEN_EXPIRES_AT: ${{ vars.SCANNER_TOKEN_EXPIRES_AT }}
          WRANGLER_SEND_METRICS: "false"
          WRANGLER_WRITE_LOGS: "false"
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scanner-watchdog-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/scanner/dist/maintenance/result.json
          if-no-files-found: warn
          retention-days: 30
      - name: Explain a failed maintenance check
        if: failure()
        run: |
          echo "## Private scanner maintenance needs attention" >> "$GITHUB_STEP_SUMMARY"
          echo "Inspect result.json and the failed step. This check sends only private health GETs; it never scans documents, refreshes signatures or deploys a Worker." >> "$GITHUB_STEP_SUMMARY"
          echo "Restore the dedicated credential, activation or reviewed refresh workflow as indicated. A missing or disabled refresh must not be treated as healthy." >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub Actions failure notifications depend on the maintainer's notification settings. A disabled watchdog or unavailable GitHub scheduler needs independent external supervision." >> "$GITHUB_STEP_SUMMARY"
